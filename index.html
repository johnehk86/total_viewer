<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>문서 뷰어</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Cpath d='M11 8h7l5 5v11a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="home" class="logo" type="button" title="처음 화면으로" aria-label="처음 화면으로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /><path d="M14 3v5h5" class="fold" /></svg>
        </button>
        <span id="app-title" class="app-title">문서 뷰어</span>
        <div id="doc-info" class="doc-info" hidden>
          <span id="doc-badge" class="badge"></span>
          <div class="doc-text">
            <div id="doc-name" class="doc-name"></div>
            <div id="doc-meta" class="doc-meta"></div>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <div id="page-indicator" class="page-indicator" hidden></div>
        <div id="zoom" class="segmented" hidden>
          <button id="zoom-out" type="button" title="축소 (Ctrl -)" aria-label="축소">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <button id="zoom-reset" type="button" class="zoom-level" title="100%로 (Ctrl 0)">100%</button>
          <button id="zoom-in" type="button" title="확대 (Ctrl +)" aria-label="확대">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
          </button>
        </div>
        <label class="btn btn-primary" title="파일 열기 (Ctrl O)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /></svg>
          <span>열기</span>
          <input id="file-input" type="file" accept=".pdf,.docx,.hwp,.hwpx" hidden />
        </label>
      </div>
    </header>

    <main id="viewport">
      <section id="empty" class="empty">
        <label for="file-input" class="drop-card">
          <span class="drop-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5" /><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
          </span>
          <span class="drop-title">문서를 여기로 끌어다 놓으세요</span>
          <span class="drop-sub">또는 <span class="link">파일 선택</span></span>
          <span class="chips">
            <span class="chip" data-type="pdf">PDF</span>
            <span class="chip" data-type="docx">DOCX</span>
            <span class="chip" data-type="hwp">HWP</span>
            <span class="chip" data-type="hwpx">HWPX</span>
          </span>
        </label>
        <p class="footnote">파일은 이 기기 안에서만 열리며 어디에도 전송되지 않아요.</p>
      </section>

      <section id="loading" class="state" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>문서를 여는 중…</p>
      </section>

      <section id="error" class="state" hidden>
        <span class="state-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7.5v5M12 16v.01" /></svg>
        </span>
        <h2>파일을 열 수 없어요</h2>
        <p id="error-msg"></p>
        <label for="file-input" class="btn">다른 파일 열기</label>
      </section>

      <div id="content" class="content"></div>
    </main>

    <div id="drag-overlay" class="drag-overlay" hidden>
      <div class="drag-overlay-inner">놓아서 열기</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
